# ============================================================
# 5 AM SHIFT
# Original schedules: UTC
# Converted to IST (UTC + 05:30)
# ============================================================

[job-local "5am-signin-0500"]
schedule = 0 0 5 * * *
command = /scheduler/run_job.sh 5am-signin-0500 signin

[job-local "5am-signin-0510"]
schedule = 0 10 5 * * *
command = /scheduler/run_job.sh 5am-signin-0510 signin

[job-local "5am-signin-1005"]
schedule = 0 5 10 * * *
command = /scheduler/run_job.sh 5am-signin-1005 signin

[job-local "5am-signout-1400"]
schedule = 0 0 14 * * *
command = /scheduler/run_job.sh 5am-signout-1400 signout

[job-local "5am-signout-1410"]
schedule = 0 10 14 * * *
command = /scheduler/run_job.sh 5am-signout-1410 signout


# ============================================================
# 1 PM SHIFT
# Original schedules: UTC
# Converted to IST (UTC + 05:30)
# ============================================================

[job-local "1pm-signin-1255"]
schedule = 0 55 12 * * *
command = /scheduler/run_job.sh 1pm-signin-1255 signin

[job-local "1pm-signin-1305"]
schedule = 0 5 13 * * *
command = /scheduler/run_job.sh 1pm-signin-1305 signin

[job-local "1pm-signout-2215"]
schedule = 0 15 22 * * *
command = /scheduler/run_job.sh 1pm-signout-2215 signout

[job-local "1pm-signout-2225"]
schedule = 0 25 22 * * *
command = /scheduler/run_job.sh 1pm-signout-2225 signout


# ============================================================
# 6 PM - 4 AM SHIFT
# Already in IST
# No conversion required
# ============================================================

[job-local "6pm-signin-1800"]
schedule = 0 0 18 * * *
command = /scheduler/run_job.sh 6pm-signin-1800 signin

[job-local "tracker-reminder-1800"]
schedule = 0 0 18 * * 1-5
command = /scheduler/run_job.sh tracker-reminder-1800 tracker

[job-local "6pm-signout-0400"]
schedule = 0 0 4 * * *
command = /scheduler/run_job.sh 6pm-signout-0400 signout


# ============================================================
# MONITOR SUPPORT
#
# Independent of HR shift.
# Runs every 45 minutes.
#
# Duration-based schedule - no UTC/IST conversion required.
# ============================================================

[job-local "monitor-support"]
schedule = @every 45m
command = /scheduler/run_job.sh monitor-support monitor

